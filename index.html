<!-- ==========================================
     FILE: Index.html
     FRONTEND UI & LOGIC (HTML + CSS + JS)
     ========================================== -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Daftar Hadir - Informatika Fun</title>
  
  <!-- Tailwind CSS untuk styling yang cepat dan modern -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SweetAlert2 untuk notifikasi alert yang keren -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- FontAwesome untuk Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Konfigurasi Tema Warna (Sesuai Konsep Desain) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'soft-denim': '#60A5FA',
            'medium-denim': '#3B82F6',
            'dusty-blue': '#64748B',
            'light-sky': '#E0F2FE',
            'very-soft-blue': '#F0F9FF',
            'cyan-accent': '#06B6D4'
          }
        }
      }
    }
  </script>

  <style>
    /* Styling Custom untuk efek Glassmorphism */
    body {
      background-color: #F0F9FF; /* very-soft-blue */
      background-image: radial-gradient(circle at top right, #E0F2FE 0%, transparent 40%),
                        radial-gradient(circle at bottom left, #E0F2FE 0%, transparent 40%);
      background-attachment: fixed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
      border-radius: 1rem;
    }

    /* Custom Radio Buttons untuk Status Kehadiran (Segmented Control style) */
    .status-radio input[type="radio"] {
      display: none;
    }
    .status-radio label {
      display: inline-block;
      padding: 6px 12px;
      margin: 2px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      background-color: #F1F5F9;
      color: #64748B;
      border: 1px solid transparent;
    }
    
    /* Warna aktif ketika dipilih */
    .status-radio input[value="Hadir"]:checked + label { background-color: #10B981; color: white; box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3); }
    .status-radio input[value="Sakit"]:checked + label { background-color: #3B82F6; color: white; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3); }
    .status-radio input[value="Izin"]:checked + label { background-color: #F59E0B; color: white; box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.3); }
    .status-radio input[value="Alpa"]:checked + label { background-color: #EF4444; color: white; box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.3); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-slate-800">

  <!-- ================= HEADER ================= -->
  <header class="text-center mb-8">
    <div class="inline-flex items-center justify-center space-x-3 mb-2 text-medium-denim">
      <i class="fas fa-clipboard-check text-2xl"></i>
      <i class="fas fa-microchip text-xl text-cyan-accent opacity-50"></i>
      <i class="far fa-calendar-alt text-2xl"></i>
    </div>
    <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-medium-denim">DAFTAR HADIR</h1>
    <p class="text-dusty-blue font-medium mt-1">Absensi Pembelajaran Informatika • <span class="text-cyan-accent">INFORMATIKA FUN</span></p>
  </header>

  <!-- ================= PANEL KONTROL (FILTER) ================= -->
  <div class="glass-card p-6 mb-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Pilih Kelas -->
      <div>
        <label class="block text-sm font-bold text-dusty-blue mb-2"><i class="fas fa-users mr-2"></i>PILIH KELAS</label>
        <select id="selectKelas" onchange="gantiKelas()" class="w-full p-3 rounded-xl border border-blue-100 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-soft-denim transition">
          <option value="">-- Pilih Kelas --</option>
          <option value="VII.1">VII.1</option>
          <option value="VII.2">VII.2</option>
          <option value="VIII.1">VIII.1</option>
          <option value="VIII.2">VIII.2</option>
          <option value="VIII.3">VIII.3</option>
          <option value="IX.1">IX.1</option>
          <option value="IX.2">IX.2</option>
        </select>
      </div>

      <!-- Pilih Tanggal -->
      <div>
        <label class="block text-sm font-bold text-dusty-blue mb-2"><i class="far fa-calendar mr-2"></i>TANGGAL PEMBELAJARAN</label>
        <input type="date" id="inputTanggal" class="w-full p-3 rounded-xl border border-blue-100 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-soft-denim transition">
      </div>

      <!-- Pilih Pertemuan -->
      <div>
        <label class="block text-sm font-bold text-dusty-blue mb-2"><i class="fas fa-book-open mr-2"></i>PILIH PERTEMUAN</label>
        <select id="selectPertemuan" class="w-full p-3 rounded-xl border border-blue-100 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-soft-denim transition">
          <option value="">-- Pilih Pertemuan --</option>
          <!-- Digenerate oleh JS -->
        </select>
      </div>

    </div>

    <!-- Tombol Aksi -->
    <div class="mt-6 flex flex-wrap gap-3 justify-center md:justify-start">
      <button onclick="hadirSemua()" class="px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold shadow-md hover:shadow-lg transition flex items-center">
        <i class="fas fa-check-double mr-2"></i> HADIR SEMUA
      </button>
      <button onclick="simpanAbsensi()" id="btnSimpan" class="px-6 py-3 bg-medium-denim hover:bg-blue-700 text-white rounded-xl font-bold shadow-md hover:shadow-lg transition flex items-center">
        <i class="fas fa-save mr-2"></i> SIMPAN ABSENSI
      </button>
      <button onclick="bukaRekap()" class="px-6 py-3 bg-dusty-blue hover:bg-slate-700 text-white rounded-xl font-bold shadow-md hover:shadow-lg transition flex items-center">
        <i class="fas fa-chart-bar mr-2"></i> REKAP HADIR
      </button>
      <button onclick="downloadExcel()" class="px-6 py-3 bg-cyan-accent hover:bg-cyan-600 text-white rounded-xl font-bold shadow-md hover:shadow-lg transition flex items-center ml-auto">
        <i class="fas fa-file-excel mr-2"></i> EXCEL
      </button>
    </div>
  </div>

  <!-- ================= KARTU STATISTIK ================= -->
  <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6" id="panelStatistik" style="display: none;">
    <div class="glass-card p-4 text-center border-l-4 border-dusty-blue">
      <i class="fas fa-users text-dusty-blue text-2xl mb-1"></i>
      <div class="text-xs font-bold text-slate-500">TOTAL SISWA</div>
      <div class="text-2xl font-black text-slate-700" id="statTotal">0</div>
    </div>
    <div class="glass-card p-4 text-center border-l-4 border-emerald-500">
      <i class="fas fa-smile text-emerald-500 text-2xl mb-1"></i>
      <div class="text-xs font-bold text-slate-500">HADIR</div>
      <div class="text-2xl font-black text-emerald-600" id="statHadir">0</div>
    </div>
    <div class="glass-card p-4 text-center border-l-4 border-blue-500">
      <i class="fas fa-thermometer-half text-blue-500 text-2xl mb-1"></i>
      <div class="text-xs font-bold text-slate-500">SAKIT</div>
      <div class="text-2xl font-black text-blue-600" id="statSakit">0</div>
    </div>
    <div class="glass-card p-4 text-center border-l-4 border-amber-500">
      <i class="fas fa-envelope-open-text text-amber-500 text-2xl mb-1"></i>
      <div class="text-xs font-bold text-slate-500">IZIN</div>
      <div class="text-2xl font-black text-amber-600" id="statIzin">0</div>
    </div>
    <div class="glass-card p-4 text-center border-l-4 border-red-500">
      <i class="fas fa-user-times text-red-500 text-2xl mb-1"></i>
      <div class="text-xs font-bold text-slate-500">ALPA</div>
      <div class="text-2xl font-black text-red-600" id="statAlpa">0</div>
    </div>
  </div>

  <!-- ================= TABEL ABSENSI ================= -->
  <div class="glass-card overflow-hidden" id="panelTabel" style="display: none;">
    
    <!-- Pencarian Siswa -->
    <div class="p-4 border-b border-white/50 bg-white/30">
      <div class="relative">
        <i class="fas fa-search absolute left-4 top-3.5 text-slate-400"></i>
        <input type="text" id="inputCari" onkeyup="cariSiswa()" placeholder="Cari nama siswa..." class="w-full pl-11 p-3 rounded-xl border border-blue-100 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-soft-denim">
      </div>
    </div>

    <!-- Container Tabel -->
    <div class="overflow-x-auto p-4">
      <table class="w-full text-left border-collapse" id="tabelSiswa">
        <thead>
          <tr class="bg-light-sky text-medium-denim">
            <th class="p-4 rounded-tl-xl font-bold w-16 text-center">NO</th>
            <th class="p-4 font-bold">NAMA SISWA</th>
            <th class="p-4 rounded-tr-xl font-bold text-center w-80">STATUS KEHADIRAN</th>
          </tr>
        </thead>
        <tbody id="bodyTabelSiswa">
          <!-- Data siswa dimasukkan via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Pesan belum pilih kelas -->
  <div id="pesanAwal" class="text-center p-12 text-dusty-blue glass-card">
    <i class="fas fa-clipboard-list text-6xl mb-4 opacity-50"></i>
    <h3 class="text-xl font-bold">Silakan pilih kelas terlebih dahulu.</h3>
    <p class="text-sm mt-2">Daftar siswa akan otomatis muncul di sini.</p>
  </div>


  <!-- ================= JAVASCRIPT ================= -->
  <script>
    // 1. DATABASE SISWA UTAMA (Sesuai instruksi)
    const databaseSiswa = {
      "VII.1": [
        "FARIS NAUVAL", "ABDILLAH KHUSAIRY", "AQIFAH NUR AIN", "ARMAN ARDI", "FAIS MUBARAT", 
        "IMAM AL GHAZALI", "KHAERUNNISA", "MUH. FADLI", "MUH. FAIZ ADZANI", "MUH. FAQIH ISKANDAR", 
        "MUH. RAFA DZAKWANSYAM", "MUHAMMAD ALIF AKBAR", "MUHAMMAD ASKAR", "MUHAMMAD AZHAR", 
        "NUR ALISAH PUTRI", "NUR ANNISA", "NURFADILA ZAHRA", "NURLIYANA RAMADANI", "RAHMAT HIDAYAT", 
        "REZKI AULIA", "RISKA AULIA SAPUTRI"
      ],
      "VII.2": [
        "AISHA FARHANA", "AKBAR", "ARIL SAPUTRA", "ASHIRATUL SYAHRA", "AURA KASIH", "ERWING", 
        "IZZATUL MUNAWIR", "MUH. ASFAR", "MUH. ASHRAF", "MUH. FAISAL", "MUH. SYAWAL", 
        "MUHAMMAD ALQAF AL BUQHARI", "MUNAWWARA", "MUTFIKA WANA", "NAUFAL AFKRA ZAINAL", 
        "NUR RAYATUL YUSDA", "NURFADLA", "RAMADAN", "RIFKY IBNU HARSAD", "WAHYU ASHARI", "ZELDA SAVITRI ANWAR"
      ],
      "VIII.1": [
        "ALIYA RATU SALSABILA", "ANDIKA", "ANITA MAWAR", "AZWAN FAIZ", "DIVAL ALFIANDRA", 
        "ISRA FIRAHMAT", "ISTIQOMAH", "M.RISKI ADITYA", "MUAKIFATUN NAILAH USMAN", "MUH. UZNUL KHUDUD", 
        "MUH. YAZID ALGHYFARI", "MUH.ALVIANSYAH", "MUHAMMAD ALIF", "MUHAMMAD ANAMTA MUCTIALI", "MUTMAINNA", 
        "NUR WAHYUNI", "NURUL APRILIA", "NUZULIA RAHMA", "REZKY AMELIA", "RIVAL MUHAJIRIN", 
        "SALSABILA AZ-ZAHRA", "ULFATUN NISA", "ZHUFAHIRA ADZHA PUTRI"
      ],
      "VIII.2": [
        "AFIF AL GIFARI", "ALIF AKRAM", "AYIRA", "DIRHAN FAIS", "FIRKAN PUTRA", "FIRMANSYAH", 
        "FITRI AGUSTINA", "HASRUL", "KHAERUL AZZAM", "MAJSYANDHA", "MUH. RIFALDI", "MUHAMMAD ARIL", 
        "MUHAMMAD MANSUR", "NAILA", "NAZILAH AZAHRA", "NUR AIVAH", "NUR FAUZIA ANNISA", "NUR FAZIRA", 
        "NUR WAFIQAH", "NURLINDA", "RIFYAH AMALIAH HAM", "ZAINAB ASVIA"
      ],
      "VIII.3": [
        "MARSYAH KOYRALA", "AFGIAN TRI WIJAYA", "AFIFAH UFAIRAH", "ARFI AZAN", "DANDI", 
        "FAUZIL RAHMAT", "HILDA NURSIDQIAZIZAH", "ISMAIL", "KARIIMAH SHOBRYYAH", "KHAIRUL FAJAR", 
        "KIRANA SYAM", "MUH. AGIH", "MUH. RENALDI", "MUSTAFAINAL YAHYA", "NINDYA GURATTU AENI", 
        "NURAENI", "NURUL BIDASARI AULIYA", "SALMIA", "SUFRIADY", "TIARA RAMADHANI"
      ],
      "IX.1": [
        "ARIL ARDIANSYAH", "ASHAR ASDAR", "A.RISMA ASTARI", "AHSANUL QASAS", "AMELIA PUTRI", 
        "ANDI NURAFIFA R.BASO", "ARIF RAHMAN", "ASMIRANDA", "ATIKAH FAJARWATY", "CHELSEA AMINITY PUTRI", 
        "HAIKAL", "IIN INAYAH PUTRI", "JAYA SAPUTRA", "KASMIA DAHNIA", "KHAERUL AZZAM", "MARSIJI", 
        "MOHAMMAD WAHYU", "MUH.ILLIAS", "MUHAMMAD ZIDAN ARKANA", "NURAENI", "NURLAILY", "NURSAHDA", 
        "NURSYAKILA", "SUCI RAMADHANI", "SUL JALALIN WALIQRAM", "SYAMSURYADI", "SYARLINI"
      ],
      "IX.2": [
        "A. KHALIFATUL ADAWIYA", "AGHYVANNO ALIFQA AZZAM", "ANDI AMSYA", "ARIANTI", "ASKIA NUR FADILLAH", 
        "FEBRIANI MAULIDYA", "IKBAL RADIMAN", "IRWANSYAH", "ISFA SALSABILA", "MIKA NUR AKBAR", 
        "MUH ASRAM DANI", "MUH JAELANI", "MUH.RIJALUL HAQ", "MUHAMMAD AHAR ADHYRA", "MUHAMMAD FAHRI", 
        "MUHAMMAD FAWWAZ", "MUHDIYATUL ADZQIYAH", "NENSI", "NURFATIMA", "NURUL AINI", "PUTRI DIANA", 
        "RIFKATUL JANNA", "SAPUTRA EFENDI", "SELVY SAID", "SITI AQILA ANNISA", "SULFAIDAH"
      ]
    };

    // State Aplikasi (untuk menyimpan memori sementara)
    let currentStudents = [];
    let absensiState = {}; // Format: {"Nama": "Hadir", ...}

    // 2. Inisialisasi Halaman (Generate 19 Pertemuan)
    document.addEventListener("DOMContentLoaded", function() {
      const selectPertemuan = document.getElementById("selectPertemuan");
      for (let i = 1; i <= 19; i++) {
        let option = document.createElement("option");
        option.value = "Pertemuan " + i;
        option.text = "Pertemuan " + i;
        selectPertemuan.appendChild(option);
      }
    });

    // 3. Menangani Perubahan Kelas
    function gantiKelas() {
      const kelas = document.getElementById("selectKelas").value;
      if (!kelas) {
        document.getElementById("panelTabel").style.display = "none";
        document.getElementById("panelStatistik").style.display = "none";
        document.getElementById("pesanAwal").style.display = "block";
        return;
      }

      currentStudents = databaseSiswa[kelas] || [];
      absensiState = {}; // Reset state absensi
      
      document.getElementById("inputCari").value = "";
      document.getElementById("pesanAwal").style.display = "none";
      document.getElementById("panelTabel").style.display = "block";
      document.getElementById("panelStatistik").style.display = "grid";
      
      renderTabel(currentStudents);
      updateStatistik();
    }

    // 4. Render Tabel Berdasarkan Data Siswa
    function renderTabel(dataSiswa) {
      const tbody = document.getElementById("bodyTabelSiswa");
      tbody.innerHTML = "";

      dataSiswa.forEach((nama, index) => {
        // Ambil status yang sudah dipilih (jika ada)
        const statusH = absensiState[nama] === "Hadir" ? "checked" : "";
        const statusS = absensiState[nama] === "Sakit" ? "checked" : "";
        const statusI = absensiState[nama] === "Izin" ? "checked" : "";
        const statusA = absensiState[nama] === "Alpa" ? "checked" : "";

        const tr = document.createElement("tr");
        tr.className = "border-b border-slate-200 hover:bg-slate-50 transition";
        tr.innerHTML = `
          <td class="p-4 text-center font-medium text-slate-500">${index + 1}</td>
          <td class="p-4 font-bold text-slate-700">${nama}</td>
          <td class="p-4 text-center">
            <div class="status-radio flex justify-center space-x-1">
              <input type="radio" id="H_${index}" name="status_${index}" value="Hadir" onchange="catatStatus('${nama}', 'Hadir')" ${statusH}>
              <label for="H_${index}">HADIR</label>
              
              <input type="radio" id="S_${index}" name="status_${index}" value="Sakit" onchange="catatStatus('${nama}', 'Sakit')" ${statusS}>
              <label for="S_${index}">SAKIT</label>
              
              <input type="radio" id="I_${index}" name="status_${index}" value="Izin" onchange="catatStatus('${nama}', 'Izin')" ${statusI}>
              <label for="I_${index}">IZIN</label>
              
              <input type="radio" id="A_${index}" name="status_${index}" value="Alpa" onchange="catatStatus('${nama}', 'Alpa')" ${statusA}>
              <label for="A_${index}">ALPA</label>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 5. Menyimpan status sementara di memori JS & update card stat
    function catatStatus(nama, status) {
      absensiState[nama] = status;
      updateStatistik();
    }

    // 6. Tombol "HADIR SEMUA"
    function hadirSemua() {
      if (currentStudents.length === 0) {
        Swal.fire({ icon: 'warning', title: 'Oops...', text: '⚠ Silakan pilih kelas terlebih dahulu.' });
        return;
      }
      
      currentStudents.forEach(nama => {
        absensiState[nama] = "Hadir";
      });
      
      // Render ulang tabel supaya radio button terupdate secara visual
      // Gunakan nilai search jika sedang mencari
      cariSiswa(); 
      updateStatistik();
    }

    // 7. Update Angka Statistik Real-time
    function updateStatistik() {
      let h = 0, s = 0, i = 0, a = 0;
      currentStudents.forEach(nama => {
        let st = absensiState[nama];
        if(st === "Hadir") h++;
        if(st === "Sakit") s++;
        if(st === "Izin") i++;
        if(st === "Alpa") a++;
      });

      document.getElementById("statTotal").innerText = currentStudents.length;
      document.getElementById("statHadir").innerText = h;
      document.getElementById("statSakit").innerText = s;
      document.getElementById("statIzin").innerText = i;
      document.getElementById("statAlpa").innerText = a;
    }

    // 8. Fungsi Pencarian Siswa (Real-time Filter)
    function cariSiswa() {
      const keyword = document.getElementById("inputCari").value.toUpperCase();
      const filtered = currentStudents.filter(nama => nama.includes(keyword));
      renderTabel(filtered); // Render ulang tabel hanya dengan data yang difilter
    }

    // 9. Simpan Ke Database (Google Sheets) via Apps Script backend
    function simpanAbsensi() {
      const kelas = document.getElementById("selectKelas").value;
      const tanggal = document.getElementById("inputTanggal").value;
      const pertemuan = document.getElementById("selectPertemuan").value;

      // Validasi Input
      if (!kelas) return Swal.fire({ icon: 'warning', text: '⚠ Silakan pilih kelas terlebih dahulu.' });
      if (!tanggal) return Swal.fire({ icon: 'warning', text: '⚠ Silakan pilih tanggal pembelajaran.' });
      if (!pertemuan) return Swal.fire({ icon: 'warning', text: '⚠ Silakan pilih pertemuan.' });

      // Cek apakah ada siswa yang belum diabsen
      const blmAbsen = currentStudents.filter(nama => !absensiState[nama]);
      if (blmAbsen.length > 0) {
        return Swal.fire({ icon: 'warning', text: '⚠ Masih ada siswa yang belum diabsen.' });
      }

      // Siapkan paket data untuk backend
      const record = [];
      currentStudents.forEach(nama => {
        record.push({ nama: nama, status: absensiState[nama] });
      });

      const payload = {
        kelas: kelas,
        tanggal: tanggal,
        pertemuan: pertemuan,
        students: record
      };

      // Loading State
      const btn = document.getElementById("btnSimpan");
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> MENYIMPAN...';
      btn.disabled = true;

      // Kirim data ke Code.gs
      google.script.run.withSuccessHandler(function(response) {
        btn.innerHTML = '<i class="fas fa-save mr-2"></i> SIMPAN ABSENSI';
        btn.disabled = false;
        
        if(response.success) {
          Swal.fire({ icon: 'success', title: 'Berhasil!', text: '✓ Absensi berhasil disimpan!' });
        } else {
          Swal.fire({ icon: 'error', title: 'Gagal Menyimpan', text: response.message });
        }
      }).saveAttendance(payload);
    }

    // 10. Fitur Rekap dan Export
    function bukaRekap() {
      Swal.fire({
        title: 'Fitur Rekap',
        text: 'Data telah tersimpan rapi. Untuk melihat rekap lengkap per pertemuan, silakan gunakan tombol DOWNLOAD EXCEL.',
        icon: 'info',
        confirmButtonColor: '#3B82F6'
      });
    }

    function downloadExcel() {
      Swal.fire({
        title: 'Menyiapkan File...',
        text: 'Sedang membuat link file Excel Anda.',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      google.script.run.withSuccessHandler(function(url) {
        Swal.fire({
          icon: 'success',
          title: 'Siap Diunduh!',
          text: '✓ Rekap Excel berhasil dibuat dan siap diunduh!',
          confirmButtonText: 'Download Excel',
          confirmButtonColor: '#06B6D4'
        }).then((result) => {
          if (result.isConfirmed) {
            window.open(url, '_blank');
          }
        });
      }).getSpreadsheetUrl();
    }
  </script>
</body>
</html>
